name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Validate tag and extract release notes
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Release tags must be vMAJOR.MINOR.PATCH.'
          }
          $project = [xml](Get-Content .\src\Dito\Dito.csproj -Raw)
          if ($project.Project.PropertyGroup.Version -cne $version) {
            throw "Release tag $env:GITHUB_REF_NAME does not match the project version."
          }
          $changelog = Get-Content .\CHANGELOG.md -Raw
          $heading = [regex]::Escape($version)
          $section = [regex]::Match($changelog, "(?ms)^## $heading[ \t]*\r?\n(.*?)(?=^## |\z)")
          $notes = $section.Groups[1].Value.Trim()
          if (!$notes) {
            throw "CHANGELOG.md needs a nonempty section headed '## $version'."
          }
          New-Item -ItemType Directory -Path .\release | Out-Null
          Set-Content -Path .\release\notes.md -Value $notes -Encoding utf8

      - name: Test release build
        run: dotnet test .\Dito.slnx -c Release --filter "Category!=Performance"

      - name: Publish self-contained Windows archives
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            $publishDir = ".\publish\$rid"
            dotnet publish .\src\Dito\Dito.csproj -c Release -r $rid --self-contained true -o $publishDir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Compress-Archive -Path "$publishDir\*" -DestinationPath ".\release\Dito-$env:GITHUB_REF_NAME-$rid.zip"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release/
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-files

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Dito $GITHUB_REF_NAME" --notes-file notes.md \
            "Dito-$GITHUB_REF_NAME-win-x64.zip" "Dito-$GITHUB_REF_NAME-win-arm64.zip"
