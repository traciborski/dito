name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Validate tag and extract release notes
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Release tags must be vMAJOR.MINOR.PATCH.'
          }
          $version = $env:RELEASE_TAG.Substring(1)
          $changelog = Get-Content .\CHANGELOG.md -Raw
          $heading = [regex]::Escape($version)
          $section = [regex]::Match($changelog, "(?ms)^## $heading[ \t]*\r?\n(.*?)(?=^## |\z)")
          $notes = $section.Groups[1].Value.Trim()
          if (!$notes) {
            throw "CHANGELOG.md needs a nonempty section headed '## $version'."
          }
          New-Item -ItemType Directory -Path .\release | Out-Null
          Set-Content -Path .\release\notes.md -Value $notes -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_VERSION=$version" -Encoding utf8

      - name: Test release build
        shell: pwsh
        run: |
          foreach ($project in 'Dito.Tests', 'Dito.Windows.Tests') {
            dotnet test ".\tests\$project\$project.csproj" -c Release "-p:Version=$env:RELEASE_VERSION" --filter "Category!=Performance"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish self-contained Windows archives
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            $publishDir = ".\publish\$rid"
            dotnet publish .\src\Dito.Windows\Dito.Windows.csproj -c Release -r $rid --self-contained true "-p:Version=$env:RELEASE_VERSION" -o $publishDir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Compress-Archive -Path "$publishDir\*" -DestinationPath ".\release\Dito-$env:RELEASE_TAG-$rid.zip"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/
          if-no-files-found: error

  package-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Validate tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tags must be vMAJOR.MINOR.PATCH.' >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Test release build
        run: |
          dotnet test tests/Dito.Tests -c Release "-p:Version=$RELEASE_VERSION" --filter "Category!=Performance"
          dotnet test tests/Dito.X11.Tests -c Release "-p:Version=$RELEASE_VERSION"

      - name: Publish native X11 and GNOME archives
        run: |
          mkdir -p release
          for rid in linux-x64 linux-arm64; do
            dotnet publish src/Dito.X11 -c Release -r "$rid" --self-contained true \
              "-p:Version=$RELEASE_VERSION" -o "publish/$rid"
            tar -czf "release/Dito-X11-$RELEASE_TAG-$rid.tar.gz" -C "publish/$rid" .
            bash scripts/package-gnome.sh "$rid" "$RELEASE_VERSION" "release/Dito-Gnome-$RELEASE_TAG-$rid.zip"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/
          if-no-files-found: error

  release:
    needs: [package, package-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Dito $RELEASE_TAG" --notes-file notes.md \
            "Dito-$RELEASE_TAG-win-x64.zip" "Dito-$RELEASE_TAG-win-arm64.zip" \
            "Dito-X11-$RELEASE_TAG-linux-x64.tar.gz" "Dito-X11-$RELEASE_TAG-linux-arm64.tar.gz" \
            "Dito-Gnome-$RELEASE_TAG-linux-x64.zip" "Dito-Gnome-$RELEASE_TAG-linux-arm64.zip"
