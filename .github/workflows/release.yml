name: Release

on:
  push:
    branches: [main]
    paths: [version.yaml]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check version bump and extract release notes
        id: version
        shell: pwsh
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true

          function Read-Version([string] $content) {
            if ($content.Trim() -cnotmatch '^version:[ \t]+"(?<number>(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){1,2})"$') {
              throw 'version.yaml must contain version: "MAJOR.MINOR" or version: "MAJOR.MINOR.PATCH".'
            }
            $number = $Matches.number
            if ($number.Split('.').Length -eq 2) { $number += '.0' }
            return [version] $number
          }

          $version = Read-Version (Get-Content .\version.yaml -Raw)
          if ($env:BEFORE_SHA -notmatch '^0+$' -and (git ls-tree $env:BEFORE_SHA -- version.yaml)) {
            $previous = Read-Version ((git show "${env:BEFORE_SHA}:version.yaml") -join "`n")
            if ($version -eq $previous) { exit 0 }
            if ($version -lt $previous) { throw "Version must increase ($previous -> $version)." }
          }

          $heading = [regex]::Escape($version)
          $changelog = Get-Content .\CHANGELOG.md -Raw
          $notes = [regex]::Match($changelog, "(?ms)^## $heading[ \t]*\r?\n(.*?)(?=^## |\z)").Groups[1].Value.Trim()
          if (!$notes) { throw "CHANGELOG.md needs a nonempty section headed '## $version'." }

          Set-Content -Path notes.md -Value $notes -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version" -Encoding utf8

      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.version != ''
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  package:
    needs: prepare
    if: needs.prepare.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: v${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test shared core
        shell: pwsh
        run: dotnet test (Join-Path tests Dito.Tests) -c Release "-p:Version=$env:RELEASE_VERSION" --filter "Category!=Performance"

      - name: Test Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet test .\tests\Dito.Windows.Tests -c Release "-p:Version=$env:RELEASE_VERSION" --filter "Category!=Performance"

      - name: Publish self-contained Windows archives
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\release | Out-Null
          foreach ($rid in 'win-x64', 'win-arm64') {
            $publishDir = ".\publish\$rid"
            dotnet publish .\src\Dito.Windows\Dito.Windows.csproj -c Release -r $rid --self-contained true "-p:Version=$env:RELEASE_VERSION" -o $publishDir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Compress-Archive -Path "$publishDir\*" -DestinationPath ".\release\Dito-$env:RELEASE_TAG-$rid.zip"
          }

      - name: Test X11
        if: runner.os == 'Linux'
        run: dotnet test tests/Dito.X11.Tests -c Release "-p:Version=$RELEASE_VERSION"

      - name: Publish native X11 and GNOME archives
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          for rid in linux-x64 linux-arm64; do
            dotnet publish src/Dito.X11 -c Release -r "$rid" --self-contained true \
              "-p:Version=$RELEASE_VERSION" -o "publish/$rid"
            tar -czf "release/Dito-X11-$RELEASE_TAG-$rid.tar.gz" -C "publish/$rid" .
            bash scripts/package-gnome.sh "$rid" "$RELEASE_VERSION" "release/Dito-Gnome-$RELEASE_TAG-$rid.zip"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: release/
          if-no-files-found: error

  release:
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: v${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin "$GITHUB_SHA:refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Dito $RELEASE_TAG" --notes-file notes.md \
            "Dito-$RELEASE_TAG-win-x64.zip" "Dito-$RELEASE_TAG-win-arm64.zip" \
            "Dito-X11-$RELEASE_TAG-linux-x64.tar.gz" "Dito-X11-$RELEASE_TAG-linux-arm64.tar.gz" \
            "Dito-Gnome-$RELEASE_TAG-linux-x64.zip" "Dito-Gnome-$RELEASE_TAG-linux-arm64.zip"
